<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon - OUTR</title>
  <link rel="icon" type="image/png" href="https://outr.ac.in/public/uploads/logo_4.png" />
  <script src="/navbar-footer-loader.js" defer></script>
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    main {
      max-width: 32rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #0b3c5d;
      margin: 0 0 0.5rem;
    }
    .badge {
      display: inline-block;
      background: #d4af37;
      color: #0b3c5d;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    p { color: #64748b; line-height: 1.65; font-size: 0.95rem; margin: 0 0 1.5rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary { background: #0b3c5d; color: #fff; }
    .btn-primary:hover { background: #1f5a8a; transform: scale(1.02); }
    .btn-secondary { background: #f1f5f9; color: #0b3c5d; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <!-- Inline-styled page loader to prevent unstyled flash -->
  <div id="page-loader" style="position: fixed; inset: 0; background: #0b3c5d; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.4s ease, visibility 0.4s ease; font-family: sans-serif;">
    <div style="width: 44px; height: 44px; border: 3px solid rgba(212, 175, 55, 0.15); border-top: 3px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
    <div style="color: #ffffff; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; text-align: center; padding: 0 20px;">Odisha University of Technology & Research</div>
    <div style="color: #d4af37; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-align: center;">Preparing page...</div>
  </div>

  <main>
    <div class="badge">Coming soon</div>
    <h1 id="page-title">This section</h1>
    <p>
      We are preparing this part of the OUTR website. Check back soon, or return to the university homepage.
    </p>
    <div class="actions">
      <a href="/home.html" class="btn btn-primary">University homepage</a>
      <a href="/portal" class="btn btn-secondary">Services portal</a>
    </div>
  </main>
  
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title') || params.get('page') || 'This section';
      document.getElementById('page-title').textContent = title;
      document.title = title + ' - Coming Soon | OUTR';

      let loaderRemoved = false;
      function removeLoader() {
        if (loaderRemoved) return;
        loaderRemoved = true;
        
        const loader = document.getElementById('page-loader');
        const main = document.querySelector('main');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          setTimeout(() => loader.remove(), 500);
        }
        if (main) {
          main.style.opacity = '1';
        }
      }

      // Hide loader with a 350ms paint & font buffer when the unified loader signals readiness
      document.addEventListener('outr-unified-loader-ready', () => {
        setTimeout(removeLoader, 350);
      });

      // Fallback handlers
      window.addEventListener('load', () => {
        setTimeout(removeLoader, 500);
      });
      setTimeout(removeLoader, 2000); // hard limit
    })();
  </script>
</body>
</html>
