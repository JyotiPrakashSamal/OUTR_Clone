[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# University marketing homepage at site root
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

# React SPA fallback (static files in dist are served first when they exist)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
